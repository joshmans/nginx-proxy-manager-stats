# Fork only (not part of the upstream pull request): builds and publishes the Docker image
# of this fork to the GitHub Container Registry.
name: Publish image

on:
  push:
    tags: ["v*-stats*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, for example 2.16.0-stats.2"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/joshmans/nginx-proxy-manager-stats

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Same steps as scripts/ci/frontend-build, in the same base image
      - name: Build and test the frontend
        run: |
          docker run --rm \
            -e CI=true \
            -e NODE_OPTIONS=--openssl-legacy-provider \
            -v "$(pwd)/frontend:/app/frontend" \
            -w /app/frontend nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install && yarn lint && yarn locale-compile && yarn vitest run --no-color && yarn build && chown -R $(id -u):$(id -g) /app/frontend"

      - name: Test the backend
        run: |
          docker run --rm \
            -v "$(pwd)/backend:/app/backend" \
            -w /app/backend nginxproxymanager/nginx-full:certbot-node \
            sh -c "yarn install && yarn validate-schema && yarn test"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/joshmans/nginx-proxy-manager-stats
            org.opencontainers.image.description=Nginx Proxy Manager with optional traffic statistics
            org.opencontainers.image.licenses=MIT
          build-args: |
            BUILD_VERSION=${{ steps.v.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
